name: Deploy React to IONOS (SFTP)

on:
  push:
    branches:
      - cicd

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install

      - name: Build React app
        run: npm run build

      - name: Upload build via SFTP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: access-5018709514.webspace-host.com
          username: ${{ secrets.IONOS_FTP_USER }}
          password: ${{ secrets.IONOS_FTP_PASSWORD }}
          port: 22
          source: "build/*"
          target: "/public/Portefolio"
