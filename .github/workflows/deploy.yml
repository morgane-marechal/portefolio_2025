name: Deploy React to IONOS

on:
  push:
    branches:
      - cicd 

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Build React app
        run: npm run build

      - name: Upload build with SFTP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.IONOS_FTP_HOST }}
          username: ${{ secrets.IONOS_FTP_USER }}
          password: ${{ secrets.IONOS_FTP_PASSWORD }}
          port: 22
          source: "build/*"
          target: "public/"      
          rm: true               
          chmod: "644"           
          chmod_dir: "755"      
      
      - name: Add .htaccess for React Router
        run: |
          echo "RewriteEngine On
          RewriteBase /
          RewriteRule ^index\.html$ - [L]
          RewriteCond %{REQUEST_FILENAME} !-f
          RewriteCond %{REQUEST_FILENAME} !-d
          RewriteRule . /index.html [L]" > public/.htaccess
          scp -P 22 public/.htaccess ${{ secrets.IONOS_FTP_USER }}@${{ secrets.IONOS_FTP_HOST }}:public/.htaccess

